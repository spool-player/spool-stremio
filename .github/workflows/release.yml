name: Provider
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Qt and zstd
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev zstd
      - name: Verify pinned SDK
        run: python3 tools/check-sdk.py
      - name: Build the contract runner
        run: cmake -S sdk -B build/sdk -G Ninja && cmake --build build/sdk
      - name: Contract (JIT)
        run: timeout 20s build/sdk/provider-contract-runner tests/contract.mjs
      - name: Contract (interpreter only)
        env:
          QV4_FORCE_INTERPRETER: '1'
        run: timeout 20s build/sdk/provider-contract-runner tests/contract.mjs
      - name: HTTP protocol smoke
        run: node tests/network-smoke.mjs
      - name: Build and validate package
        run: |
          python3 sdk/spool-provider.py build . --output "dist/$(python3 -c 'import json; m = json.load(open("manifest.json")); print(m["id"] + "-" + m["version"])').szo"
          python3 sdk/spool-provider.py validate dist/*.szo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-package
          path: dist/*.szo
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'spool-player/spool-stremio'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build archive and release feed
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/check-sdk.py
          ID=$(python3 -c 'import json; print(json.load(open("manifest.json"))["id"])')
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "$RELEASE_TAG" = "v$VERSION"
          PACKAGE="dist/$ID-$VERSION.szo"
          python3 sdk/spool-provider.py build . --output "$PACKAGE"
          python3 sdk/spool-provider.py feed "$PACKAGE" --url "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/$ID-$VERSION.szo" > dist/spool-provider.json
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: dist/*.szo
      - name: Publish provider release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.szo dist/spool-provider.json --verify-tag --title "$RELEASE_TAG" --notes "Original Stremio add-on provider with an external streaming server. Add this repository from Spool's provider settings."
